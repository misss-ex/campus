<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кампус</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!--CAMPUS:BEGIN-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Layout: one column ≤480px, floating glass tab bar, bottom sheet for group picking */
  :root {
    color-scheme: dark;
    --bg: #0a1310; --bg-2: #0e1a16; --card: #12211c; --card-2: #172a24; --line: rgba(160, 220, 195, .09); --line-2: rgba(160, 220, 195, .18);
    --text: #e9f3ee; --muted: #8fa89d; --faint: #5d7569;
    --accent: #7fe0b5; --accent-ink: #062418; --accent-soft: rgba(127, 224, 181, .13); --glow: rgba(127, 224, 181, .22);
    --t-lecture: #7fe0b5; --t-practice: #8cb8ff; --t-lab: #f3c278; --t-clinical: #f39cc0; --t-other: #a9b6b0;
    --warn: #f3c278; --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    --r-lg: 22px; --r-md: 16px; --r-sm: 12px;
    --font: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    /* отступы от краёв экрана: Telegram сам задаёт --tg-*-inset-* (Bot API 8.0) */
    --sb: max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px));
    --st: 0px;
  }
  /* полноэкранный режим: шапки Telegram нет, контент ниже статус-бара и кнопок «Закрыть / ⋯» */
  :root.fs { --st: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px)); }
  :root[data-accent="lavender"] { --accent: #c4b3ff; --accent-ink: #1d1442; --accent-soft: rgba(196, 179, 255, .14); --glow: rgba(196, 179, 255, .24); --t-lecture: #c4b3ff; }
  :root[data-accent="lavender"]:not([data-mode="light"]) { --bg: #100f16; --bg-2: #15131d; --card: #1a1824; --card-2: #211e2d; --line: rgba(200, 190, 255, .09); --line-2: rgba(200, 190, 255, .18); --muted: #9d97b0; --faint: #6b6580; }
  :root[data-mode="light"] {
    color-scheme: light;
    --bg: #f2f6f4; --bg-2: #e9f0ec; --card: #ffffff; --card-2: #f4faf7; --line: rgba(20, 60, 45, .08); --line-2: rgba(20, 60, 45, .16);
    --text: #10211b; --muted: #5e736a; --faint: #93a59d;
    --accent: #1fa673; --accent-ink: #ffffff; --accent-soft: rgba(31, 166, 115, .1); --glow: rgba(31, 166, 115, .18);
    --t-lecture: #1fa673; --t-practice: #3b7ae0; --t-lab: #c9851d; --t-clinical: #d0457e; --t-other: #73827b;
    --warn: #b9770f; --shadow: 0 8px 24px rgba(20, 60, 45, .08);
  }
  :root[data-mode="light"][data-accent="lavender"] { --accent: #6f55e8; --accent-soft: rgba(111, 85, 232, .1); --glow: rgba(111, 85, 232, .18); --t-lecture: #6f55e8; --card-2: #f7f5ff; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); }
  body { min-height: 100vh; padding-bottom: calc(96px + var(--sb)); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: 260px; background: radial-gradient(120% 100% at 50% 0%, var(--glow), transparent 70%); pointer-events: none; z-index: 0; opacity: .7; }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  .wrap { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding-block: calc(12px + var(--st)) 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .num { font-variant-numeric: tabular-nums; }

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0 18px; }
  .eyebrow { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
  h1 { margin: 2px 0 0; font-size: 28px; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
  .group-pill { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px 0 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line-2); font-weight: 700; font-size: 14px; box-shadow: var(--shadow); }
  .group-pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }

  /* hero */
  .hero { position: relative; overflow: hidden; border-radius: var(--r-lg); padding: 20px; background: linear-gradient(160deg, var(--card-2), var(--card)); border: 1px solid var(--line-2); box-shadow: var(--shadow); }
  .hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, var(--glow), transparent 70%); pointer-events: none; }
  .hero-row { display: flex; align-items: center; gap: 18px; }
  .ring { position: relative; width: 104px; height: 104px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .track { stroke: var(--line-2); }
  .ring .bar { stroke: var(--accent); transition: stroke-dashoffset .6s ease; }
  .ring .val { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .val b { font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -.03em; }
  .ring .val span { font-size: 11px; color: var(--muted); font-weight: 600; margin-top: 2px; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 4px 10px; border-radius: 999px; }
  .status.idle { color: var(--muted); background: var(--line); }
  .live { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .hero h2 { margin: 10px 0 4px; font-size: 19px; font-weight: 800; line-height: 1.25; letter-spacing: -.01em; text-wrap: balance; }
  .meta { display: flex; gap: 6px; align-items: flex-start; font-size: 13px; color: var(--muted); }
  .meta svg { width: 14px; height: 14px; flex: none; margin-top: 2px; opacity: .8; }
  .hero-foot { display: flex; justify-content: space-between; margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line-2); font-size: 12px; color: var(--muted); }
  .hero-foot b { color: var(--text); font-weight: 700; }
  .idle-big { font-size: 22px; font-weight: 800; margin: 12px 0 4px; letter-spacing: -.01em; }

  .section { display: flex; justify-content: space-between; align-items: baseline; margin: 24px 2px 10px; }
  .section h3 { margin: 0; font-size: 16px; font-weight: 800; }
  .section span { font-size: 12px; color: var(--muted); font-weight: 600; }

  /* lesson list */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .lesson { display: grid; grid-template-columns: 54px 1fr; gap: 12px; padding: 14px; border-radius: var(--r-md); background: var(--card); border: 1px solid var(--line); position: relative; }
  .lesson .t b { display: block; font-size: 15px; font-weight: 800; }
  .lesson .t span { font-size: 12px; color: var(--faint); font-weight: 600; }
  .lesson .s { font-weight: 700; line-height: 1.3; margin-bottom: 4px; min-width: 0; }
  .lesson .body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .tag { align-self: flex-start; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; color: var(--tc); background: color-mix(in srgb, var(--tc) 14%, transparent); margin-bottom: 4px; }
  .tag::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .lesson.now { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .lesson.past { opacity: .5; }
  .warn { font-size: 12px; color: var(--warn); margin-top: 4px; }
  .empty { text-align: center; padding: 34px 16px; border-radius: var(--r-md); border: 1px dashed var(--line-2); color: var(--muted); }
  .empty b { display: block; color: var(--text); font-size: 16px; margin-bottom: 4px; }

  /* week strip */
  .weekbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .weekbar .m { font-weight: 800; font-size: 15px; }
  .weekbar .nav { display: flex; gap: 6px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); }
  .icon-btn svg { width: 18px; height: 18px; }
  .chip-btn { height: 36px; padding: 0 12px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
  .day { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); transition: transform .15s; }
  .day:active { transform: scale(.96); }
  .day small { font-size: 11px; color: var(--muted); font-weight: 600; }
  .day b { font-size: 17px; font-weight: 800; }
  .day .dots { position: absolute; bottom: 5px; display: flex; gap: 2px; }
  .day .dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); opacity: .7; }
  .day.today b { color: var(--accent); }
  .day.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 18px var(--glow); }
  .day.sel small, .day.sel b { color: var(--accent-ink); }
  .day.sel .dots i { background: var(--accent-ink); }
  .day.off b { color: var(--faint); }

  /* settings */
  .group-card { width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: var(--r-md); background: var(--card); border: 1px solid var(--line); text-align: left; }
  .avatar { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: 13px; flex: none; }
  .group-card .gt { flex: 1; min-width: 0; }
  .group-card .gt b { display: block; font-size: 16px; font-weight: 800; }
  .group-card .gt span { font-size: 12px; color: var(--muted); }
  .chev { color: var(--faint); width: 18px; height: 18px; flex: none; }
  .label { font-size: 12px; font-weight: 700; color: var(--muted); margin: 22px 2px 8px; text-transform: uppercase; letter-spacing: .06em; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px; gap: 4px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
  .seg button { height: 36px; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .seg button.sel { background: var(--card-2); color: var(--text); box-shadow: 0 1px 0 var(--line-2) inset, 0 2px 8px rgba(0, 0, 0, .15); }
  .swatches { display: flex; gap: 10px; }
  .swatch { flex: 1; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-weight: 700; font-size: 13px; }
  .swatch i { width: 20px; height: 20px; border-radius: 50%; }
  .swatch.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .about { margin-top: 26px; text-align: center; font-size: 12px; color: var(--faint); }
  .cards { display: grid; gap: 8px; }
  .favs { display: flex; flex-wrap: wrap; gap: 6px; }
  .fav { display: inline-flex; align-items: center; height: 36px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 13px; font-weight: 700; }
  .fav > button { height: 100%; padding: 0 12px; }
  .fav > .x { padding: 0 12px 0 2px; color: var(--faint); font-size: 16px; }
  .fav.sel { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .fav.add { padding: 0 14px; color: var(--muted); border-style: dashed; }
  .fb-text { width: 100%; min-height: 140px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--card); color: var(--text); font: inherit; font-size: 15px; resize: vertical; outline: none; }
  .fb-text:focus { border-color: var(--accent); }
  .fb-hint { font-size: 13px; color: var(--muted); margin: 0 0 10px; line-height: 1.45; }
  .fb-err { font-size: 13px; color: var(--warn); margin-top: 8px; }
  .btn { width: 100%; height: 48px; margin-top: 12px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 15px; }
  .btn:disabled { opacity: .5; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(96px + var(--sb)); z-index: 60; max-width: 420px; margin: 0 auto; padding: 12px 16px; border-radius: 14px; background: var(--text); color: var(--bg); font-weight: 700; font-size: 14px; text-align: center; box-shadow: var(--shadow); animation: fade .2s ease; }

  /* sheet */
  .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); backdrop-filter: blur(2px); z-index: 40; opacity: 0; transition: opacity .2s; }
  .scrim.open { opacity: 1; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 520px; margin: 0 auto; max-height: 78vh; display: flex; flex-direction: column; background: var(--bg-2); border-radius: 24px 24px 0 0; border: 1px solid var(--line-2); border-bottom: 0; box-shadow: 0 -20px 50px rgba(0, 0, 0, .35); transform: translateY(100%); transition: transform .28s cubic-bezier(.2, .8, .2, 1); padding-bottom: var(--sb); }
  .sheet.open { transform: none; }
  .sheet-head { padding: 10px max(16px, env(safe-area-inset-left, 0px)) 8px; }
  .grabber { width: 40px; height: 4px; border-radius: 4px; background: var(--line-2); margin: 0 auto 12px; }
  .sheet-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .sheet-title b { font-size: 18px; font-weight: 800; }
  .search { position: relative; }
  .search input { width: 100%; height: 44px; padding: 0 14px 0 40px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--card); outline: none; }
  .search input:focus { border-color: var(--accent); }
  .search svg { position: absolute; left: 13px; top: 13px; width: 18px; height: 18px; color: var(--faint); }
  .tabs-row { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; scrollbar-width: none; }
  .tabs-row::-webkit-scrollbar { display: none; }
  .pill { flex: none; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .pill.sel { background: var(--text); color: var(--bg); border-color: var(--text); }
  .sheet-body { overflow-y: auto; padding: 4px max(16px, env(safe-area-inset-left, 0px)) 18px; }
  .gh { font-size: 12px; font-weight: 700; color: var(--muted); margin: 14px 0 8px; }
  .ggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
  .g { height: 40px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-weight: 700; font-size: 13px; }
  .g.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* tab bar */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding-top: 8px; padding-bottom: calc(10px + var(--sb)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
  nav.tabs .in { pointer-events: auto; max-width: 360px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 6px; border-radius: 22px; background: color-mix(in srgb, var(--card) 82%, transparent); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); border: 1px solid var(--line-2); box-shadow: var(--shadow); }
  nav.tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0; border-radius: 16px; font-size: 11px; font-weight: 700; color: var(--muted); transition: background .2s, color .2s; }
  nav.tabs button svg { width: 21px; height: 21px; }
  nav.tabs button.sel { background: var(--accent-soft); color: var(--accent); }
  [hidden] { display: none !important; }
  .fade { animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap" id="app">
  <section id="v-now" hidden>
    <header class="top">
      <div><div class="eyebrow" id="now-date"></div><h1>Сейчас</h1></div>
      <button class="group-pill" data-open-sheet><i></i><span id="now-group"></span></button>
    </header>
    <div id="now-body"></div>
  </section>

  <section id="v-schedule" hidden>
    <header class="top">
      <div><div class="eyebrow" id="sch-sub"></div><h1>Расписание</h1></div>
      <button class="group-pill" data-open-sheet><i></i><span id="sch-group"></span></button>
    </header>
    <div class="weekbar">
      <span class="m" id="sch-month"></span>
      <div class="nav">
        <button class="chip-btn" id="sch-today">Сегодня</button>
        <button class="icon-btn" id="sch-prev" aria-label="Предыдущая неделя"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="icon-btn" id="sch-next" aria-label="Следующая неделя"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
    </div>
    <div class="days" id="sch-days"></div>
    <div class="section"><h3 id="sch-title"></h3><span id="sch-count"></span></div>
    <div class="list" id="sch-list"></div>
  </section>

  <section id="v-settings" hidden>
    <header class="top"><div><div class="eyebrow">Кампус</div><h1>Настройки</h1></div></header>
    <div class="label" style="margin-top:0">Моя группа</div>
    <button class="group-card" data-open-sheet>
      <span class="avatar" id="set-av"></span>
      <span class="gt"><b id="set-g"></b><span id="set-gs"></span></span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <div class="label">Избранные группы</div>
    <div class="favs" id="set-favs"></div>
    <div class="label">Тема</div>
    <div class="seg" id="set-theme"><button data-v="dark">Тёмная</button><button data-v="light">Светлая</button><button data-v="telegram">Авто</button></div>
    <div class="label">Акцент</div>
    <div class="swatches" id="set-accent">
      <button class="swatch" data-v="mint"><i style="background:#7fe0b5"></i>Мята</button>
      <button class="swatch" data-v="lavender"><i style="background:#c4b3ff"></i>Лаванда</button>
    </div>
    <div class="label">Поделиться</div>
    <button class="group-card" id="set-share">
      <span class="avatar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></span>
      <span class="gt"><b>Расписание группы</b><span id="set-share-s">Отправить ссылку одногруппникам</span></span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <div class="label">Помощь</div>
    <div class="cards">
      <button class="group-card" data-fb="report">
        <span class="avatar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg></span>
        <span class="gt"><b>Ошибка в расписании?</b><span>Напишите — мы поправим</span></span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button class="group-card" data-fb="idea">
        <span class="avatar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"/></svg></span>
        <span class="gt"><b>Идеи для реализации</b><span>Чего не хватает в приложении?</span></span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="about" id="set-version"></div>
  </section>

  <div id="boot" class="empty" style="margin-top:40vh">Загрузка расписания…</div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t" hidden>
  <div class="sheet-head">
    <div class="grabber"></div>
    <div class="sheet-title"><b id="sheet-t">Выбор группы</b><button class="icon-btn" id="sheet-close" aria-label="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="sheet-q" type="search" placeholder="Номер группы, например КП-101" autocomplete="off"></label>
    <div class="tabs-row" id="sheet-favs"></div>
    <div class="tabs-row" id="sheet-fac"></div>
    <div class="tabs-row" id="sheet-course"></div>
  </div>
  <div class="sheet-body" id="sheet-list"></div>
</div>
<div class="sheet" id="fb" role="dialog" aria-modal="true" aria-labelledby="fb-t" hidden>
  <div class="sheet-head">
    <div class="grabber"></div>
    <div class="sheet-title"><b id="fb-t"></b><button class="icon-btn" id="fb-close" aria-label="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  </div>
  <div class="sheet-body">
    <p class="fb-hint" id="fb-hint"></p>
    <textarea class="fb-text" id="fb-text" maxlength="2000"></textarea>
    <div class="fb-err" id="fb-err" hidden></div>
    <button class="btn" id="fb-send">Отправить</button>
  </div>
</div>

<nav class="tabs"><div class="in">
  <button data-go="now"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Сейчас</button>
  <button data-go="schedule"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Расписание</button>
  <button data-go="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Настройки</button>
</div></nav>

<script type="module">
import { Schedule, prefs, moscowNow, formatDayTitle, formatMonth, addDays, mondayOf, studyWeek } from './schedule.js';

const tg = window.Telegram?.WebApp;
const BOT = 'stgmu_helpbot';
try { tg?.ready(); tg?.expand(); } catch {}
// на телефоне — на весь экран, без шапки Telegram; на компьютере остаётся обычное окно
const markFs = () => document.documentElement.classList.toggle('fs', !!tg?.isFullscreen);
try {
  tg?.onEvent?.('fullscreenChanged', markFs);
  if (tg?.isVersionAtLeast?.('8.0') && ['ios', 'android'].includes(tg.platform)) {
    tg.requestFullscreen();
    tg.disableVerticalSwipes();  // чтобы прокрутка вниз не сворачивала приложение
  }
  markFs();
} catch {}
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; };
const PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>';
const USER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>';
const haptic = t => { try { t === 'sel' ? tg?.HapticFeedback?.selectionChanged() : tg?.HapticFeedback?.notificationOccurred(t); } catch {} };

const S = new Schedule({ baseUrl: './data' });
const st = { view: 'now', group: null, data: null, selDate: null, theme: 'dark', accent: 'mint', favs: [] };

function applyTheme() {
  let t = st.theme;
  if (t === 'telegram') t = tg?.colorScheme ? (tg.colorScheme === 'light' ? 'light' : 'dark') : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.dataset.mode = t;
  document.documentElement.dataset.accent = st.accent;
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  try { tg?.setHeaderColor(bg); tg?.setBackgroundColor(bg); tg?.setBottomBarColor?.(bg); } catch {}
}
try { tg?.onEvent?.('themeChanged', applyTheme); } catch {}

function go(view) {
  st.view = view;
  for (const v of ['now', 'schedule', 'settings']) { const el = $('v-' + v); el.hidden = v !== view; if (v === view) { el.classList.remove('fade'); void el.offsetWidth; el.classList.add('fade'); } }
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('sel', b.dataset.go === view));
  render();
  try { view === 'now' ? tg?.BackButton?.hide() : tg?.BackButton?.show(); } catch {}
  window.scrollTo(0, 0);
}
try { tg?.BackButton?.onClick(() => fbOpen ? closeFb() : sheetOpen ? closeSheet() : go('now')); } catch {}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (b) { haptic('sel'); go(b.dataset.go); }
  if (e.target.closest('[data-open-sheet]')) openSheet();
});

function render() {
  if (!st.data) return;
  if (st.view === 'now') renderNow();
  if (st.view === 'schedule') renderSchedule();
  if (st.view === 'settings') renderSettings();
}

const typeColor = t => `var(--t-${t || 'other'})`;
function lessonCard(l, nowMin = null) {
  const isNow = nowMin != null && l.startMin <= nowMin && nowMin < l.endMin;
  const past = nowMin != null && nowMin >= l.endMin;
  return `<div class="lesson${isNow ? ' now' : ''}${past ? ' past' : ''}">
    <div class="t num"><b>${l.start}</b><span>${l.end}</span></div>
    <div class="body">
      <span class="tag" style="--tc:${typeColor(l.type)}">${esc(l.type_label)}${isNow ? ' · идёт' : ''}</span>
      <div class="s">${esc(l.subject)}</div>
      ${l.teacher ? `<div class="meta">${USER}<span>${esc(l.teacher)}</span></div>` : ''}
      ${l.room ? `<div class="meta">${PIN}<span>${esc(l.room)}</span></div>` : ''}
      ${l.conflict ? `<div class="warn">В PDF в это же время стоит «${esc(l.conflict)}». Уточните у старосты</div>` : ''}
    </div></div>`;
}
function ring(progress, big, small) {
  const C = 2 * Math.PI * 44, off = C * (1 - Math.max(0, Math.min(1, progress)));
  return `<div class="ring"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="44" fill="none" stroke-width="8"/><circle class="bar" cx="50" cy="50" r="44" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg><div class="val num"><b>${big}</b><span>${small}</span></div></div>`;
}

function renderNow() {
  const n = S.getNow(st.data);
  $('now-date').textContent = `${formatDayTitle(n.date)} · неделя ${n.studyWeek}`;
  $('now-group').textContent = st.group;
  let h = '';
  if (n.state === 'lesson') {
    const c = n.current;
    h += `<div class="hero"><div class="hero-row">${ring(n.progress, n.minutesLeft, plural(n.minutesLeft, 'минута', 'минуты', 'минут'))}
      <div style="min-width:0"><span class="status"><i class="live"></i>Идёт пара ${n.position.index} из ${n.position.total}</span>
      <h2>${esc(c.subject)}</h2><div class="meta">${esc(c.type_label)}${c.teacher ? ' · ' + esc(c.teacher) : ''}</div></div></div>
      ${c.room ? `<div class="meta" style="margin-top:12px">${PIN}<span>${esc(c.room)}</span></div>` : ''}
      ${c.conflict ? `<div class="warn">В PDF в это же время стоит «${esc(c.conflict)}»</div>` : ''}
      <div class="hero-foot num"><span>Начало <b>${c.start}</b></span><span>прошло ${n.minutesPassed} мин</span><span>Конец <b>${c.end}</b></span></div></div>`;
  } else {
    const label = { break: 'Перемена', before: 'Пары ещё не начались', done: 'На сегодня всё', free: 'Сегодня выходной' }[n.state];
    const soon = n.minutesToNext != null;
    h += `<div class="hero"><div class="hero-row">${soon ? ring(1 - Math.min(n.minutesToNext, 120) / 120, n.minutesToNext, 'до пары') : ''}
      <div><span class="status idle">${label}</span>
      <div class="idle-big">${soon ? 'Следующая пара скоро' : n.next ? 'Отдыхай' : 'Пар больше нет'}</div>
      <div class="meta">${n.next ? `Следующая: ${n.next.date === n.date ? 'сегодня' : esc(formatDayTitle(n.next.date).toLowerCase())}, ${n.next.start}` : 'В расписании дальше пусто'}</div></div></div></div>`;
  }
  if (n.next) {
    const brk = n.state === 'lesson' && n.next.date === n.date ? `перемена ${n.next.startMin - n.current.endMin} мин` : '';
    h += `<div class="section"><h3>Дальше</h3><span>${brk}</span></div><div class="list">${lessonCard(n.next)}</div>`;
  }
  if (n.today.length) h += `<div class="section"><h3>Сегодня</h3><span>${n.today.length} ${plural(n.today.length, 'пара', 'пары', 'пар')}</span></div><div class="list">${n.today.map(l => lessonCard(l, n.minutes)).join('')}</div>`;
  $('now-body').innerHTML = h;
}

function renderSchedule() {
  const { iso: todayIso, minutes } = moscowNow();
  const sel = st.selDate || todayIso;
  const week = S.getWeek(st.data, sel);
  $('sch-sub').textContent = `Учебная неделя ${studyWeek(sel, st.data.semester)}`;
  $('sch-group').textContent = st.group;
  $('sch-month').textContent = formatMonth(sel);
  $('sch-days').innerHTML = week.map(d => `<button class="day num${d.date === sel ? ' sel' : ''}${d.date === todayIso ? ' today' : ''}${d.lessons.length ? '' : ' off'}" data-d="${d.date}"><small>${d.weekday}</small><b>${d.day}</b><span class="dots">${'<i></i>'.repeat(Math.min(d.lessons.length, 4))}</span></button>`).join('');
  const day = week.find(d => d.date === sel);
  $('sch-title').textContent = day.title;
  $('sch-count').textContent = day.lessons.length ? `${day.lessons.length} ${plural(day.lessons.length, 'пара', 'пары', 'пар')}` : '';
  $('sch-list').innerHTML = day.lessons.length ? day.lessons.map(l => lessonCard(l, sel === todayIso ? minutes : null)).join('')
    : `<div class="empty"><b>Занятий нет</b>Можно выдохнуть</div>`;
}
$('sch-days').addEventListener('click', e => { const b = e.target.closest('[data-d]'); if (b) { st.selDate = b.dataset.d; haptic('sel'); renderSchedule(); } });
$('sch-prev').onclick = () => { st.selDate = addDays(mondayOf(st.selDate || moscowNow().iso), -7); renderSchedule(); };
$('sch-next').onclick = () => { st.selDate = addDays(mondayOf(st.selDate || moscowNow().iso), 7); renderSchedule(); };
$('sch-today').onclick = () => { st.selDate = null; renderSchedule(); };
let tx = null;
$('sch-list').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
$('sch-list').addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 60) { st.selDate = addDays(st.selDate || moscowNow().iso, dx < 0 ? 1 : -1); renderSchedule(); } });

function groupInfo(id) { return S.listGroups().find(x => x.id === id); }
function renderSettings() {
  const g = groupInfo(st.group);
  $('set-av').textContent = g ? g.id.split('-')[0] : '?';
  $('set-g').textContent = g ? g.id : 'Не выбрана';
  $('set-gs').textContent = g ? `${g.faculty_name} · ${g.course} курс${g.stream ? ', ' + g.stream + ' поток' : ''}` : 'Нажмите, чтобы выбрать';
  document.querySelectorAll('#set-theme button').forEach(b => b.classList.toggle('sel', b.dataset.v === st.theme));
  document.querySelectorAll('#set-accent button').forEach(b => b.classList.toggle('sel', b.dataset.v === st.accent));
  $('set-share-s').textContent = g ? `Отправить ссылку на ${g.id} одногруппникам` : 'Отправить ссылку одногруппникам';
  $('set-favs').innerHTML = st.favs.map(id => `<span class="fav${id === st.group ? ' sel' : ''}"><button data-fav="${esc(id)}">${esc(id)}</button><button class="x" data-unfav="${esc(id)}" aria-label="Убрать ${esc(id)}">×</button></span>`).join('')
    + (st.favs.length < MAX_FAVS ? `<button class="fav add" data-addfav>+ Добавить</button>` : '');
  $('set-version').textContent = `${S.index.semester.title} · данные от ${S.index.generated_at.slice(8, 10)}.${S.index.generated_at.slice(5, 7)}`;
}
$('set-theme').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; st.theme = b.dataset.v; prefs.set('theme', st.theme); applyTheme(); haptic('sel'); renderSettings(); };
$('set-accent').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; st.accent = b.dataset.v; prefs.set('accent', st.accent); applyTheme(); haptic('sel'); renderSettings(); };

// ---------- выбор группы (нижняя панель)
const sh = { fac: null, course: null, mode: 'pick' };  // mode: pick — выбрать свою группу, fav — добавить в избранное
let sheetOpen = false;
function openSheet(mode = 'pick') {
  sh.mode = mode;
  $('sheet-t').textContent = mode === 'fav' ? 'Добавить в избранное' : 'Выбор группы';
  const g = groupInfo(st.group);
  sh.fac = g?.faculty || S.index.faculties[0].id; sh.course = g?.course ?? null;
  $('sheet-q').value = '';
  $('scrim').hidden = $('sheet').hidden = false;
  requestAnimationFrame(() => { $('scrim').classList.add('open'); $('sheet').classList.add('open'); });
  sheetOpen = true; renderSheet();
  try { tg?.BackButton?.show(); } catch {}
}
function closeSheet() {
  $('scrim').classList.remove('open'); $('sheet').classList.remove('open'); sheetOpen = false;
  setTimeout(() => { if (!sheetOpen) { $('scrim').hidden = $('sheet').hidden = true; } }, 280);
  try { if (st.view === 'now') tg?.BackButton?.hide(); } catch {}
}
function renderSheet() {
  const q = $('sheet-q').value.trim().toLowerCase().replace(/[\s\-]/g, '');
  const facs = S.index.faculties;
  $('sheet-fac').hidden = $('sheet-course').hidden = !!q;
  const favs = sh.mode === 'pick' ? st.favs.filter(groupInfo) : [];
  $('sheet-favs').hidden = !!q || !favs.length;
  $('sheet-favs').innerHTML = favs.map(id => `<button class="pill${id === st.group ? ' sel' : ''}" data-g="${esc(id)}">★ ${esc(id)}</button>`).join('');
  $('sheet-fac').innerHTML = facs.map(f => `<button class="pill${f.id === sh.fac ? ' sel' : ''}" data-f="${f.id}">${esc(f.name)}</button>`).join('');
  const fac = facs.find(f => f.id === sh.fac);
  const courses = [...new Set(fac.courses.map(c => c.course))];
  if (!courses.includes(sh.course)) sh.course = courses[0];
  $('sheet-course').innerHTML = courses.map(c => `<button class="pill${c === sh.course ? ' sel' : ''}" data-c="${c}">${c} курс</button>`).join('');
  const blocks = q ? facs.flatMap(f => f.courses.map(c => ({ f, c })))
                   : fac.courses.filter(c => c.course === sh.course).map(c => ({ f: fac, c }));
  const html = blocks.map(({ f, c }) => {
    const gs = c.groups.filter(g => !q || g.id.toLowerCase().replace(/-/g, '').includes(q) || g.slug.replace(/-/g, '').includes(q));
    if (!gs.length) return '';
    const head = q ? `${f.name}, ${c.course} курс${c.stream ? ', ' + c.stream + ' поток' : ''}` : (c.stream ? `${c.stream} поток` : '');
    return (head ? `<div class="gh">${esc(head)}</div>` : '<div style="height:10px"></div>') + `<div class="ggrid">${gs.map(g => `<button class="g${g.id === st.group ? ' sel' : ''}" data-g="${g.id}">${g.id}</button>`).join('')}</div>`;
  }).join('');
  $('sheet-list').innerHTML = html || '<div class="empty" style="margin-top:12px"><b>Ничего не нашлось</b>Проверьте номер группы</div>';
}
$('sheet-fac').onclick = e => { const b = e.target.closest('[data-f]'); if (b) { sh.fac = b.dataset.f; sh.course = null; haptic('sel'); renderSheet(); } };
$('sheet-course').onclick = e => { const b = e.target.closest('[data-c]'); if (b) { sh.course = +b.dataset.c; haptic('sel'); renderSheet(); } };
$('sheet-q').oninput = renderSheet;
$('sheet-close').onclick = closeSheet;
$('scrim').onclick = () => fbOpen ? closeFb() : closeSheet();
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (fbOpen) closeFb(); else if (sheetOpen) closeSheet(); });
async function pickGroup(e) {
  const b = e.target.closest('[data-g]'); if (!b) return;
  if (sh.mode === 'fav') { addFav(b.dataset.g); haptic('success'); closeSheet(); return; }
  await selectGroup(b.dataset.g); prefs.set('group', st.group); haptic('success'); closeSheet(); render();
}
$('sheet-list').onclick = pickGroup;
$('sheet-favs').onclick = pickGroup;

// ---------- избранные группы: быстрое переключение (хранятся в CloudStorage, как тема и группа)
const MAX_FAVS = 6;
function saveFavs() { prefs.set('favs', JSON.stringify(st.favs)); renderSettings(); }
function addFav(id) { if (!st.favs.includes(id) && st.favs.length < MAX_FAVS) { st.favs.push(id); saveFavs(); } }
$('set-favs').onclick = async e => {
  const un = e.target.closest('[data-unfav]');
  if (un) { st.favs = st.favs.filter(x => x !== un.dataset.unfav); haptic('sel'); saveFavs(); return; }
  if (e.target.closest('[data-addfav]')) { openSheet('fav'); return; }
  const f = e.target.closest('[data-fav]');
  if (f && f.dataset.fav !== st.group) { await selectGroup(f.dataset.fav); prefs.set('group', st.group); haptic('success'); render(); }
};

// ---------- поделиться: ссылка открывает Mini App сразу на этой группе
$('set-share').onclick = () => {
  const g = groupInfo(st.group); if (!g) return;
  const url = `https://t.me/${BOT}/app?startapp=${g.slug}&mode=fullscreen`;
  const share = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(`Расписание группы ${g.id}`)}`;
  haptic('sel');
  if (tg?.openTelegramLink) tg.openTelegramLink(share); else window.open(share, '_blank');
};

// ---------- ошибка в расписании / идея: форма внутри приложения, отправка на сервер бота.
// Сервер проверяет подпись initData, сохраняет заявку и пересылает модераторам.
const FEEDBACK_API = '';  // напр. 'https://bot.example.ru/api/feedback'; пока пусто — карточки ведут в чат бота
const FB = {
  report: { title: 'Ошибка в расписании', hint: 'Укажите дату или день недели, время пары и что не так. Группа подставится сама.', ph: 'Например: чт 05.11, 11:00 — нет физкультуры' },
  idea: { title: 'Идея для приложения', hint: 'Чего не хватает? Что было бы удобно? Все идеи читаем.', ph: 'Например: напоминание за 10 минут до пары' },
};
let fbOpen = false, fbKind = 'report';
function openFb(kind) {
  fbKind = kind; const c = FB[kind];
  $('fb-t').textContent = c.title; $('fb-hint').textContent = c.hint; $('fb-text').placeholder = c.ph;
  $('fb-err').hidden = true; $('fb-send').disabled = false;
  $('scrim').hidden = $('fb').hidden = false;
  requestAnimationFrame(() => { $('scrim').classList.add('open'); $('fb').classList.add('open'); });
  fbOpen = true;
  try { tg?.BackButton?.show(); } catch {}
  setTimeout(() => $('fb-text').focus(), 300);
}
function closeFb() {
  $('scrim').classList.remove('open'); $('fb').classList.remove('open'); fbOpen = false;
  setTimeout(() => { if (!fbOpen && !sheetOpen) { $('scrim').hidden = $('fb').hidden = true; } }, 280);
  try { if (st.view === 'now') tg?.BackButton?.hide(); } catch {}
}
function toast(text) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = text;
  document.body.append(t); setTimeout(() => t.remove(), 3500);
}
function openBotFallback(kind) {  // временно, пока у бота нет публичного адреса: заявка через чат бота
  const slug = groupInfo(st.group)?.slug;
  const link = `https://t.me/${BOT}?start=${kind}${slug && kind === 'report' ? '_' + slug : ''}`;
  if (tg?.openTelegramLink) tg.openTelegramLink(link); else window.open(link, '_blank');
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-fb]'); if (!b) return;
  haptic('sel'); FEEDBACK_API ? openFb(b.dataset.fb) : openBotFallback(b.dataset.fb);
});
$('fb-close').onclick = closeFb;
$('fb-send').onclick = async () => {
  const text = $('fb-text').value.trim();
  const err = m => { $('fb-err').textContent = m; $('fb-err').hidden = false; haptic('error'); };
  if (text.length < 5) return err('Напишите чуть подробнее');
  const slug = groupInfo(st.group)?.slug || '';
  $('fb-send').disabled = true;
  try {
    const r = await fetch(FEEDBACK_API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kind: fbKind, text, group: slug, initData: tg?.initData || '' }) });
    const res = await r.json().catch(() => ({}));
    if (!r.ok || !res.ok) throw new Error(res.error || r.status);
    $('fb-text').value = ''; closeFb(); haptic('success');
    toast(fbKind === 'report' ? `Спасибо! Заявка №${res.id} принята` : 'Спасибо за идею!');
  } catch {
    $('fb-send').disabled = false; err('Не получилось отправить. Проверьте интернет и попробуйте ещё раз');
  }
};

async function selectGroup(id) { st.data = await S.loadGroup(id); st.group = st.data.group; st.selDate = null; }

(async () => {
  try {
    await S.loadIndex();
    const [g, theme, accent, favs] = await Promise.all([prefs.get('group'), prefs.get('theme'), prefs.get('accent'), prefs.get('favs')]);
    try { st.favs = (JSON.parse(favs || '[]') || []).filter(groupInfo).slice(0, MAX_FAVS); } catch { st.favs = []; }
    st.theme = theme || 'dark'; st.accent = accent || 'mint'; applyTheme();
    const start = tg?.initDataUnsafe?.start_param || new URLSearchParams(location.search).get('group');
    let pick = (start && S.findGroup(start)?.id) || (g && groupInfo(g) ? g : null);
    await selectGroup(pick || S.listGroups()[0].id);
    $('boot').hidden = true;
    go('now');
    if (!pick) openSheet();
    setInterval(() => { if (st.view === 'now' && !document.hidden) renderNow(); }, 30000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
  } catch (e) {
    $('boot').innerHTML = `<b>Не удалось загрузить расписание</b>${esc(e.message)}`;
  }
})();
</script>
